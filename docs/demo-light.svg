<text x="415" y="21" text-anchor="middle" fill="#656d76" font-size="12">ctxprofile demo</text>
<text x="18" y="64" fill="#1f2328" xml:space="preserve">sample: four public MCP servers, as their tool schemas were actually published</text>
<text x="18" y="140" fill="#010409" xml:space="preserve">model: claude-opus-4-8   input tokens: 8299   estimated (no usage block)</text>
<text x="18" y="216" fill="#656d76" xml:space="preserve">  component                      kind            tokens      %    $ cold  $ cached</text>
<text x="18" y="254" fill="#9a6700" xml:space="preserve">  mcp__sequentia…uentialthinking tool_def         1021   12.3%   0.00511   0.00051  [UNUSED]</text>
<text x="18" y="292" fill="#9a6700" xml:space="preserve">  mcp__playwrigh…take_screenshot tool_def          388    4.7%   0.00194   0.00019  [UNUSED]</text>
<text x="18" y="330" fill="#9a6700" xml:space="preserve">  mcp__playwrigh…owser_fill_form tool_def          283    3.4%   0.00142   0.00014  [UNUSED]</text>
<text x="18" y="368" fill="#9a6700" xml:space="preserve">  mcp__playwright__browser_drop  tool_def          255    3.1%   0.00128   0.00013  [UNUSED]</text>
<text x="18" y="406" fill="#9a6700" xml:space="preserve">  mcp__playwright__browser_find  tool_def          244    2.9%   0.00122   0.00012  [UNUSED]</text>
<text x="18" y="444" fill="#9a6700" xml:space="preserve">  mcp__playwright__browser_click tool_def          231    2.8%   0.00115   0.00012  [UNUSED]</text>
<text x="18" y="482" fill="#9a6700" xml:space="preserve">  mcp__playwright__browser_type  tool_def          224    2.7%   0.00112   0.00011  [UNUSED]</text>
<text x="18" y="520" fill="#9a6700" xml:space="preserve">  mcp__playwrigh…network_request tool_def          217    2.6%   0.00109   0.00011  [UNUSED]</text>
<text x="18" y="558" fill="#656d76" xml:space="preserve">  ... and 40 more components totalling 5,436 tokens</text>
<text x="18" y="634" fill="#010409" xml:space="preserve">  total $ (cold, uncached upper bound): 0.04150</text>
<text x="18" y="672" fill="#9a6700" xml:space="preserve">  46 tools not called in this capture ($0.04141 at the cold rate if they are never called):</text>
<text x="18" y="710" fill="#1f2328" xml:space="preserve">    mcp__filesystem__create_directory, mcp__filesystem__directory_tree, mcp__filesystem__edit_file and 43 more</text>
<text x="18" y="786" fill="#1f2328" xml:space="preserve">that is what those servers cost on every request, before anyone types a word.</text>
<text x="18" y="824" fill="#1f2328" xml:space="preserve">632 of those tokens (8%) are schema no tool call can reference — ctxprofile lint says which</text>
<text x="18" y="862" fill="#1f2328" xml:space="preserve">point it at your own: ctxprofile capture --out captures/   then analyze a capture</text>
