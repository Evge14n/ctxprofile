<svg xmlns="http://www.w3.org/2000/svg" width="830" height="887" viewBox="0 0 830 887" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
