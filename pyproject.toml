[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxprofile"
version = "0.11.0"
description = "Offline CLI that costs an LLM request per context component, and flags tool definitions you ship but never call."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Olga Martynyuk" }]
keywords = ["llm", "anthropic", "claude", "tokens", "cost", "context", "agents", "mcp"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
online = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "mcp>=1.2"]

[project.scripts]
ctxprofile = "ctxprofile.cli:main"
ctxprofile-mcp = "ctxprofile.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxprofile"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/ctxprofile"]

[[tool.mypy.overrides]]
module = ["mcp.*", "anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ctxprofile.mcp_server"
disallow_untyped_decorators = false
